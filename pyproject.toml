[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetinglens"
version = "0.1.0"
description = "Turn a Teams meeting recording into one markdown file: the transcript interleaved with the slides that were on screen."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Kargin" }]
keywords = ["meetings", "teams", "transcript", "slides", "ocr", "notes"]
dependencies = [
  "typer>=0.12",
  "pillow>=10",
  "numpy>=1.26",
  "imageio-ffmpeg>=0.5",
  "rapidocr-onnxruntime>=1.3",
  "structlog>=24",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
meetinglens = "meetinglens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meetinglens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
