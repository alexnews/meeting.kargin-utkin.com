name: ci

# GitHub-hosted runners are used deliberately here. They are free and unlimited
# on public repositories, and a pull request from a stranger runs in a throwaway
# VM rather than on a machine we own. If this repository is ever made private,
# these jobs move to a self-hosted runner in the same commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Lockfile is current
        run: uv lock --check

      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Types
        run: .venv/bin/mypy

      - name: Tests
        run: .venv/bin/pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: No media, nothing oversized
        run: python3 scripts/check_no_media.py

      - name: Secret scan
        run: |
          version=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
