services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meetinglens
      POSTGRES_PASSWORD: meetinglens
      POSTGRES_DB: meetinglens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinglens"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
